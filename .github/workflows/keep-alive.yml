# Supabase pauses free-tier projects after about a week with no activity, and a
# paused project can't be reached until someone restores it in the dashboard.
# This workflow makes one small read every 3 days so the project stays active.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product row
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_9Xou20b2C_H--LCbqEw11A_DDLvtqNQ" \
            -H "Authorization: Bearer sb_publishable_9Xou20b2C_H--LCbqEw11A_DDLvtqNQ" \
            "https://uxpcnpkxathduehpqkyq.supabase.co/rest/v1/products?select=id&limit=1"
